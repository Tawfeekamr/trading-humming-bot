[package]
name = "trading-engine-core"
version = "0.2.0"
edition = "2021"
description = "Pure Rust trading engine — grid, trend strategies with Binance connector"
license = "LGPL-3.0-or-later"

[[bin]]
name = "trading-bot"
path = "src/main.rs"

[[bin]]
name = "backtest_replay"
path = "src/bin/backtest_replay.rs"

[lib]
name = "trading_engine_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3/extension-module"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"

# HTTP + WebSocket
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Cryptography (Binance signing)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# File locking (advisory flock for cross-process state files shared with Python)
fs2 = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP API
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Error handling
anyhow = "1"
thiserror = "2"

# System info (Telegram /system command)
sysinfo = "0.33"

# ML inference
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

# Signal engine
rusqlite = { version = "0.34", features = ["bundled"] }
# 2.0.0 pairs with rusqlite 0.34 (same libsqlite3-sys 0.32). Newer 2.x needs
# rusqlite 0.40, which would force a conflicting libsqlite3-sys.
rusqlite_migration = "=2.0.0"

# Collections
rustc-hash = "2"

# Backtest harness: kline download + parse (bars.rs)
csv = "1"
zip = "2"

# Python bindings (optional — enabled for maturin wheel builds)
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
urlencoding = "2.1.3"
# Used by src/backtest/replay.rs (state-dir isolation) and by tests.
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
