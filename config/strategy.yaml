pair: "BTC-USDT"
exchange: "binance"
timeframe: "1h"

grid:
  levels: 8
  capital_usdt: 200
  min_usdt_reserve: 50
  order_refresh_time: 60

indicators:
  bollinger:
    period: 20
    std_dev: 2.0
  rsi:
    period: 14
    oversold: 35
    overbought: 70
  ema:
    period: 200
  atr:
    period: 14
    spacing_multiplier: 0.8

rules:
  activate_conditions:
    - "price > ema_200"
    - "rsi < 65"
  pause_conditions:
    - "price < ema_200"
    - "rsi > 70"
  reactivate_conditions:
    - "rsi < 35"
    - "price near lower_bb"

risk:
  max_drawdown_pct: 10
  daily_loss_limit_pct: 5
  max_btc_exposure_pct: 80
