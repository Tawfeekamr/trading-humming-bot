# ════════════════════════════════════════════════════════════════════
#  TA-Enhanced Multi-Pair Grid Bot — Strategy Configuration
#  All non-secret settings live here. Loaded by the strategy script.
# ════════════════════════════════════════════════════════════════════

# ── Pairs & Exchange ─────────────────────────────────────────────
pairs:
  - symbol: "DOGE-USDT"
    step_size: 1
    tick_size: 0.00001
    enabled: true
  - symbol: "ETH-USDT"
    step_size: 0.0001
    tick_size: 0.01
    enabled: true
  - symbol: "BTC-USDT"
    step_size: 0.00001
    tick_size: 0.01
    enabled: false
  - symbol: "BNB-USDT"
    step_size: 0.001
    tick_size: 0.01
    enabled: true
  - symbol: "XRP-USDT"
    step_size: 0.1
    tick_size: 0.0001
    enabled: true

exchange: "binance"
timeframe: "1h"

# ── Grid Parameters ───────────────────────────────────────────────
grid:
  levels: 5                   # Orders on each side of mid price
  capital_usdt: 5000          # Total USDT allocated
  min_usdt_reserve: 100       # Always keep this in reserve
  order_refresh_time: 60      # Seconds between order refresh

# ── Indicator Settings ────────────────────────────────────────────
indicators:
  bollinger:
    period: 15  # Sweep: 20→15 improved ETH Sharpe +0.27
    std_dev: 2.0

  rsi:
    period: 14
    oversold: 30  # Sweep: 35→30 improved DOGE Sharpe +0.24
    overbought: 70            # Grid pauses above this

  ema:
    period: 200               # Trend filter: only run grid above EMA200

  atr:
    period: 14
    spacing_multiplier: 1.5   # Grid spacing = ATR × this value

# ── Grid State Rules ──────────────────────────────────────────────
rules:
  activate_conditions:
    - "price > ema_200"
    - "rsi < 65"
  pause_conditions:
    - "price < ema_200"
    - "rsi > 70"
  reactivate_conditions:
    - "rsi < 35"
    - "price near lower_bb"

# ── Risk Management ───────────────────────────────────────────────
risk:
  max_drawdown_pct: 10        # Bot halts if portfolio drops this % from peak
  daily_loss_limit_pct: 5     # Circuit breaker if -5% in 24h
  max_base_exposure_pct: 80    # Never deploy more than 80% capital in base asset

# ── Dashboard ─────────────────────────────────────────────────────
dashboard:
  port: 8501

# ── Trend Engine ──────────────────────────────────────────────
trend:
  enabled: true
  capital: 5000                 # Trend engine capital pool ($0 = disabled)
  ema_fast: 12  # Sweep: 20→12 improved BNB Sharpe +0.49
  ema_slow: 40
  ema_trend: 200
  rsi_period: 14
  rsi_min: 50  # Sweep: 40→50 improved XRP Sharpe +0.25
  rsi_max: 80
  min_signal_score: 3
  confirmation_ticks: 1
  risk_per_trade_pct: 2.0
  max_position_pct: 25.0
  max_positions: 2
  max_total_positions: 3        # Max trend positions across ALL pairs combined
  exit_signal_threshold: 2      # Close position when signal score drops below this
  trailing_stop_pct: 1.5
  trailing_activation_pct: 1.5
  rr_ratio: 2.0
  sl_buffer_pct: 0.2
  max_drawdown_pct: 10.0
  daily_loss_limit_pct: 5.0
  timeframe: "1h"

# ── Fee Optimization ───────────────────────────────────────────
fee_optimization:
  bnb_target_usdt: 20         # Target BNB balance in USDT
  bnb_min_usdt: 10            # Buy BNB when balance drops below this
  bnb_max_usdt: 50            # Sell excess BNB when above this
  use_limit_maker: true       # Use LIMIT_MAKER (post-only) for all orders

# ── Signal Copy Engine ──────────────────────────────────────────
signal_copy:
  enabled: true                     # Signal Copy Engine active
  audit_mode: false                 # Execute trades (paper money on testnet)
  exchange: "gate_io_paper_trade"   # Dedicated exchange for signal copy (3000+ tokens)
  ai_model: "deepseek-chat"          # DeepSeek model for signal parsing

  # Position management
  max_positions: 3                  # Max concurrent signal positions
  per_trade_risk_pct: 3.0           # Risk per trade (% of signal budget)
  capital_pct: 10.0                 # % of total capital for signal trades
  max_capital_usdt: 1000            # Hard cap
  min_rr_ratio: 1.0                 # Minimum risk:reward (vs TP3)
  max_sl_distance_pct: 10.0         # Max stop-loss distance from entry (%)
  default_sl_atr_multiplier: 2.0   # Default SL = entry ± ATR × this (when signal has no SL)
  max_entry_zone_pct: 3.0           # Max entry zone width (%)
  min_quality_score: 5              # Min AI quality score (1-10) to execute trade

  # TP scaling
  tp1_close_pct: 33                 # Close 33% at TP1, move SL to breakeven
  tp2_close_pct: 50                 # Close 50% of remaining at TP2, move SL to TP1

  # Risk controls
  daily_loss_limit_pct: 5.0         # Halt after losing this % of signal capital
  max_trades_per_day: 10            # Maximum signal trades per day
  cooldown_minutes: 5               # Wait between trades
  use_btc_correlation_gate: false   # Pause when BTC regime is DANGER (disabled for testing)
  blacklisted_pairs: []             # Pairs to never trade from signals

  # Telethon
  session_name: "signal_listener"   # Session file name (saved in data/)
