# ════════════════════════════════════════════════════════════════════
#  NautilusTrader Forex Engine — Strategy Configuration
#  Loaded by src/nautilus/config.py
# ════════════════════════════════════════════════════════════════════

trader_id: "FOREX-001"
logging_level: "INFO"

# ── Interactive Brokers Connection ──────────────────────────────────
interactive_brokers:
  host: "127.0.0.1"
  port: 7497
  client_id: 1
  trading_mode: "paper"

# ── Forex Pairs ─────────────────────────────────────────────────────
pairs:
  - symbol: "EUR/USD"
    venue: "IDEALPRO"
    enabled: true
    trade_size: 10000
  - symbol: "GBP/USD"
    venue: "IDEALPRO"
    enabled: false
    trade_size: 10000
  - symbol: "USD/JPY"
    venue: "IDEALPRO"
    enabled: false
    trade_size: 10000

# ── Grid Strategy Parameters ───────────────────────────────────────
grid:
  levels: 5
  spacing_pips: 10
  take_profit_pips: 15
  stop_loss_pips: 30
  order_refresh_seconds: 60

# ── Indicator Settings ──────────────────────────────────────────────
indicators:
  ema_fast: 20
  ema_slow: 50
  ema_trend: 200
  rsi_period: 14
  rsi_oversold: 35
  rsi_overbought: 70
  atr_period: 14

# ── Risk Management ─────────────────────────────────────────────────
risk:
  max_drawdown_pct: 10
  daily_loss_limit_pct: 5
  max_position_pct: 25
  risk_per_trade_pct: 2

# ── ML Service Integration ──────────────────────────────────────────
ml_service:
  enabled: false
  url: "http://bot:8080/predict"
  poll_interval_seconds: 300

# ── MQTT Bridge ─────────────────────────────────────────────────────
mqtt:
  enabled: true
  host: "mosquitto"
  port: 1883
  topic_prefix: "hbot/nautilus"
