name: Deploy Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: "ap-northeast-1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install trading-engine-core wheel
        run: pip install maturin && cd trading-engine-core && maturin build --release && pip install target/wheels/trading_engine_core*.whl

      - name: Run Rust tests
        run: cd trading-engine-core && cargo test --lib

      - name: Run Python unit tests
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Rust bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust
          push: true
          tags: |
            ${{ env.REGISTRY }}/tawfeekamr/trading-bot:latest
            ${{ env.REGISTRY }}/tawfeekamr/trading-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Signal listener
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hybrid
          push: true
          tags: |
            ${{ env.REGISTRY }}/tawfeekamr/trading-signal-listener:latest
            ${{ env.REGISTRY }}/tawfeekamr/trading-signal-listener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS Tokyo
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --parameters commands='[
              "cd /home/ec2-user/trading-humming-bot && git fetch origin && git reset --hard origin/main 2>&1 || exit 1",
              "cd /home/ec2-user/trading-humming-bot && mkdir -p data logs models",
              "cd /home/ec2-user/trading-humming-bot && docker compose -f docker-compose.rust.yml pull 2>&1",
              "cd /home/ec2-user/trading-humming-bot && docker compose -f docker-compose.rust.yml up -d --force-recreate --remove-orphans 2>&1",
              "sleep 10 && cd /home/ec2-user/trading-humming-bot && docker compose -f docker-compose.rust.yml ps 2>&1",
              "docker image prune -af 2>&1 || true"
            ]' \
            --timeout-seconds 300 \
            --comment "Deploying Rust stack via GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "=== Deploy Output ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              echo "Deploy successful"
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "=== Deploy FAILED — Output ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              echo "=== Deploy FAILED — Stderr ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 10
          done
          echo "Deploy timed out"
          exit 1

      - name: Verify containers are running
        run: |
          sleep 15
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --parameters commands='[
              "cd /home/ec2-user/trading-humming-bot && docker compose -f docker-compose.rust.yml ps 2>&1",
              "echo SEPARATOR",
              "cd /home/ec2-user/trading-humming-bot && docker compose -f docker-compose.rust.yml logs --tail=30 2>&1"
            ]' \
            --timeout-seconds 60 \
            --comment "Verify Rust deployment" \
            --query "Command.CommandId" \
            --output text)

          for i in $(seq 1 12); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ]; then
              OUTPUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text)
              echo "=== Container Status ==="
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -q "running"; then
                echo "Stack is running"
                exit 0
              fi
              echo "=== No containers running — showing recent logs ==="
              echo "$OUTPUT" | sed -n '/^SEPARATOR$/,$ p'
              exit 1
            elif [ "$STATUS" = "Failed" ]; then
              echo "Verify failed"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 5
          done
          echo "Verify timed out"
          exit 1

      - name: Notify Telegram on success
        if: success()
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="🚀 <b>Rust Stack Deployed</b>%0A•••%0A📝 ${COMMIT_MSG}%0A🔗 Commit: ${{ github.sha }}%0A⏰ $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="❌ <b>Rust Deploy FAILED</b>%0A•••%0A🔗 Commit: ${{ github.sha }}%0ACheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
