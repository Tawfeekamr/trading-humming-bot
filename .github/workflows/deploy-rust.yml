name: Deploy Rust Bot

on:
  push:
    branches: [main]
    paths:
      - 'trading-engine-core/**'
      - 'config/**'
      - '.github/workflows/deploy-rust.yml'
  workflow_dispatch:

env:
  AWS_REGION: "ap-northeast-1"

jobs:
  deploy:
    name: Build & Deploy on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build binary on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --parameters commands='["export PATH=$PATH:/home/ec2-user/.cargo/bin","git config --global --add safe.directory /home/ec2-user/trading-humming-bot","cd /home/ec2-user/trading-humming-bot && git pull origin main 2>&1","cd /home/ec2-user/trading-humming-bot/trading-engine-core && /home/ec2-user/.cargo/bin/rustup target add x86_64-unknown-linux-musl 2>&1","cd /home/ec2-user/trading-humming-bot/trading-engine-core && /home/ec2-user/.cargo/bin/cargo build --release --target x86_64-unknown-linux-musl 2>&1","ls -lh /home/ec2-user/trading-humming-bot/trading-engine-core/target/x86_64-unknown-linux-musl/release/trading-bot","cp /home/ec2-user/trading-humming-bot/trading-engine-core/target/x86_64-unknown-linux-musl/release/trading-bot /home/ec2-user/trading-bot","chmod +x /home/ec2-user/trading-bot"]' \
            --timeout-seconds 600 \
            --comment "Build Rust bot on EC2" \
            --query "Command.CommandId" \
            --output text)

          echo "Build command: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "=== Build Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "=== Build FAILED ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done

      - name: Install systemd service and start bot
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --parameters commands='["test -f /etc/systemd/system/trading-bot.service && echo Service exists || echo \"[Unit]\" | sudo tee /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"Description=Trading Bot (Rust)\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"After=network.target\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"[Service]\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"Type=simple\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"User=ec2-user\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"WorkingDirectory=/home/ec2-user/trading-humming-bot\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"ExecStart=/home/ec2-user/trading-bot config/strategy.yaml\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"Restart=on-failure\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"RestartSec=10\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"Environment=RUST_LOG=info\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"[Install]\" | sudo tee -a /etc/systemd/system/trading-bot.service","grep -q WorkingDirectory /etc/systemd/system/trading-bot.service 2>/dev/null || echo \"WantedBy=multi-user.target\" | sudo tee -a /etc/systemd/system/trading-bot.service","sudo systemctl daemon-reload","sudo systemctl enable trading-bot","sudo systemctl restart trading-bot"]' \
            --timeout-seconds 60 \
            --comment "Install systemd service and start bot" \
            --query "Command.CommandId" --output text)

          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Service attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              break
            fi
            [ "$STATUS" = "Failed" ] && exit 1
            sleep 5
          done

      - name: Verify bot is running
        run: |
          sleep 5
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --parameters commands='["sudo systemctl status trading-bot --no-pager -l 2>&1 || true","ps aux | grep trading-bot | grep -v grep || true","free -h | head -2"]' \
            --timeout-seconds 30 \
            --comment "Verify bot running" \
            --query "Command.CommandId" --output text)

          for i in $(seq 1 12); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ]; then
              OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text)
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -q "trading-bot"; then
                echo "✅ Bot is running"
                exit 0
              fi
              echo "❌ Bot not found"
              exit 1
            fi
            [ "$STATUS" = "Failed" ] && exit 1
            sleep 5
          done

      - name: Notify Telegram on success
        if: success()
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="🦀 <b>Rust Bot Deployed</b>%0A•••%0A📝 ${COMMIT_MSG}%0A🔗 ${{ github.sha }}%0A⏰ $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="❌ <b>Rust Deploy FAILED</b>%0A•••%0A🔗 ${{ github.sha }}%0ACheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
