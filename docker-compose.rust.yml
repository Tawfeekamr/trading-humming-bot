# Docker Compose for the Rust trading bot + Python signal listener
# Images are built in CI and pushed to ghcr.io — EC2 just pulls and runs.
# Usage: docker compose -f docker-compose.rust.yml pull && docker compose -f docker-compose.rust.yml up -d

services:
  # ── Rust Trading Engine (API server on port 3030) ────────────────
  rust-bot:
    image: ghcr.io/tawfeekamr/trading-bot:latest
    container_name: trading-bot-rust
    restart: unless-stopped
    env_file: .env.rust
    ports:
      - "3030:3030"
    volumes:
      - ./config/strategy.yaml:/app/config/strategy.yaml:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - API_PORT=3030
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Python Signal Listener (Telegram → DeepSeek → Rust engine) ──
  signal-listener:
    image: ghcr.io/tawfeekamr/trading-signal-listener:latest
    container_name: trading-signal-listener
    restart: unless-stopped
    depends_on:
      rust-bot:
        condition: service_healthy
    env_file: .env.docker
    environment:
      - EXECUTION_MODE=rust
      - RUST_ENGINE_URL=http://rust-bot:3030
      # Secrets loaded from .env via python-dotenv inside container
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Regime Pusher (RF regime classifier → POST /api/v1/regime) ──────────
  # Reuses the signal-listener image (has sklearn + pandas_ta + requests).
  # Keeps the Rust engine's regime cache live so grid/MR consume ML regime
  # labels instead of falling back to None. Paper-gated, no torch.
  regime-pusher:
    image: ghcr.io/tawfeekamr/trading-signal-listener:latest
    container_name: trading-regime-pusher
    restart: unless-stopped
    command: ["python", "-m", "src.ml.regime_pusher"]
    depends_on:
      rust-bot:
        condition: service_healthy
    environment:
      - RUST_ENGINE_URL=http://rust-bot:3030
      - REGIME_PAIRS=ETH-USDT,BNB-USDT,DOGE-USDT,XRP-USDT
      - REGIME_INTERVAL_SEC=180
      - MODEL_DIR=/app/models
    volumes:
      - ./models:/app/models:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
