services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    restart: unless-stopped
    environment:
      - MQTT_BRIDGE_ENABLED=false
      - USE_MQTT=false
      - CONFIG_PASSWORD=${CONFIG_PASSWORD:-changeme}
    volumes:
      - ./data:/home/hummingbot/data
      - ./logs:/home/hummingbot/logs
      - ./.env:/home/hummingbot/.env

