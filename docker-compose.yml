services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - CONFIG_PASSWORD=${CONFIG_PASSWORD:-changeme}
      - USE_TRADING_ENGINE=${USE_TRADING_ENGINE:-true}
    volumes:
      - ./data:/home/hummingbot/data
      - ./logs:/home/hummingbot/logs
      - ./models:/home/hummingbot/models
      - ./.env:/home/hummingbot/.env
      - ./config:/home/hummingbot/config:ro


  trading-rl-shadow:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python3
      - -m
      - src.rl.live_router
      - --shadow
      - --pair
      - ETHUSDT
      - --model
      - /home/hummingbot/models/rl/ppo_ETHUSDT_2026-07-05_clean-oos-24m.zip
      - --rust-url
      - http://bot:8080
      - --shadow-path
      - /home/hummingbot/data/shadow_routing.jsonl
    restart: unless-stopped
    depends_on:
      - bot
    volumes:
      - ./data:/home/hummingbot/data
      - ./models:/home/hummingbot/models