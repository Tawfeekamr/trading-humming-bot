services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - CONFIG_PASSWORD=${CONFIG_PASSWORD:-changeme}
      - USE_TRADING_ENGINE=${USE_TRADING_ENGINE:-true}
    volumes:
      - ./data:/home/hummingbot/data
      - ./logs:/home/hummingbot/logs
      - ./models:/home/hummingbot/models
      - ./.env:/home/hummingbot/.env
      - ./config:/home/hummingbot/config:ro

  nautilus-bot:
    build:
      context: .
      dockerfile: Dockerfile.nautilus
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    env_file: .env.docker
    environment:
      - IB_HOST=${IB_HOST:-host.docker.internal}
      - IB_PORT=${IB_PORT:-7497}
      - IB_CLIENT_ID=${IB_CLIENT_ID:-1}
      - IB_TRADING_MODE=${IB_TRADING_MODE:-paper}
      - NAUTILUS_CONFIG_PATH=/app/config/nautilus.yaml
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config/nautilus.yaml:/app/config/nautilus.yaml:ro
    profiles:
      - forex
