services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    command: streamlit run app.py --server.port 8502 --server.address 0.0.0.0
    env_file: .env
    restart: unless-stopped
    ports:
      - "8502:8502"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - bot
